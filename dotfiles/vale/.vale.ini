StylesPath = styles

MinAlertLevel = suggestion

Packages = proselint, write-good

Vocab = technical-terms, tool-names

[*]
BasedOnStyles = Vale, proselint, write-good

[*.tex]
# Ignore standard LaTeX math blocks, environments, and inline code macros
BlockIgnores = (?s)(\\begin\{equation\}.*?\\end\{equation\}), (?s)(\\begin\{align\}.*?\\end\{align\}), (?s)(\\begin\{tikzpicture\}.*?\\end\{tikzpicture\})

